<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Mymo Beauty</title>
  <meta name="description" content="Mymo Beauty · Cuidamos la piel, el cuerpo y el bienestar con tratamientos avanzados ultra personalizados.">
  <meta name="theme-color" content="#F1EFE9">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400&display=swap" rel="stylesheet">
  <style>
    :root {
      /* Pantone 5763 C (verde) y 7527 C (piedra), aproximados en pantalla */
      --verde: #6F7449;
      --verde-oscuro: #4F5434;
      --piedra: #D6D2C4;
      --claro: #F6F4EF;
      --texto: #3E4130;
      --boton-bg: rgba(255, 255, 255, 0.78);
      --boton-borde: rgba(111, 116, 73, 0.28);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { min-height: 100%; }

    body {
      font-family: "Lato", system-ui, -apple-system, sans-serif;
      font-weight: 300;
      color: var(--texto);
      background-color: var(--claro);
      /* Degradado suave y claro: blanco roto → piedra → toque de verde */
      background-image: linear-gradient(175deg,
        var(--claro) 0%,
        #EEEBE3 35%,
        var(--piedra) 70%,
        #C3C4A8 100%);
      background-attachment: fixed;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      justify-content: center;
      -webkit-font-smoothing: antialiased;
    }

    .contenedor {
      width: 100%;
      max-width: 460px;
      padding: calc(52px + env(safe-area-inset-top)) 20px calc(32px + env(safe-area-inset-bottom));
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    /* ---------- Cabecera ---------- */
    .foto {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      object-fit: cover;
      background: #fff;
      border: 3px solid #fff;
      box-shadow: 0 0 0 1px var(--boton-borde), 0 10px 28px rgba(79, 84, 52, 0.16);
    }

    h1 {
      margin-top: 20px;
      font-weight: 400;
      font-size: 24px;
      letter-spacing: 0.32em;
      text-transform: uppercase;
      color: var(--verde-oscuro);
      /* compensa el espaciado de la última letra para que quede centrado */
      padding-left: 0.32em;
    }

    .descripcion {
      margin-top: 12px;
      max-width: 330px;
      font-weight: 300;
      font-size: 15px;
      line-height: 1.6;
      color: var(--texto);
    }

    /* ---------- Botones ---------- */
    .enlaces {
      width: 100%;
      margin-top: 34px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      list-style: none;
    }

    .boton {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      width: 100%;
      min-height: 60px;
      padding: 16px 20px;
      border-radius: 14px;
      background: var(--boton-bg);
      border: 1px solid var(--boton-borde);
      color: var(--verde-oscuro);
      font-family: inherit;
      font-weight: 400;
      font-size: 15px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      text-decoration: none;
      box-shadow: 0 4px 14px rgba(79, 84, 52, 0.08);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
      -webkit-tap-highlight-color: transparent;
    }

    .boton svg { width: 20px; height: 20px; flex-shrink: 0; }

    .boton:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 22px rgba(79, 84, 52, 0.14);
      background: #fff;
    }

    .boton:active { transform: scale(0.98); }

    .boton.destacado {
      background: var(--verde);
      border-color: var(--verde);
      color: #fff;
    }
    .boton.destacado:hover { background: var(--verde-oscuro); }

    .boton:focus-visible,
    .red:focus-visible {
      outline: 3px solid var(--verde-oscuro);
      outline-offset: 3px;
    }

    /* ---------- Botón de Google Maps con la dirección ---------- */
    .boton-mapa {
      text-transform: none;
      letter-spacing: 0.02em;
    }
    .mapa-texto {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      text-align: left;
      gap: 2px;
    }
    .mapa-direccion { font-size: 15px; font-weight: 400; }
    .mapa-etiqueta {
      font-size: 11px;
      font-weight: 400;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      opacity: 0.7;
    }

    /* ---------- Redes ---------- */
    .redes {
      margin-top: 30px;
      display: flex;
      gap: 18px;
      justify-content: center;
    }

    .red {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255, 255, 255, 0.8);
      border: 1px solid var(--boton-borde);
      color: var(--verde-oscuro);
      transition: transform 0.15s ease, background 0.15s ease, color 0.15s ease;
      -webkit-tap-highlight-color: transparent;
    }
    .red svg { width: 23px; height: 23px; }
    .red:hover { transform: translateY(-2px); background: var(--verde); color: #fff; }

    footer {
      position: relative;
      width: 100%;
      margin-top: auto;
      padding-top: 36px;
      min-height: 91px; /* 36px de margen + 55px del sello */
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 300;
      font-size: 11px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--verde-oscuro);
    }
    footer span { opacity: 0.75; }

    /* Sello Top Rated: pequeño, a la derecha, a la altura del copyright */
    .sello {
      position: absolute;
      right: 0;
      bottom: 0;
      width: 55px;
      height: 55px;
      border-radius: 50%;
      object-fit: cover;
      box-shadow: 0 4px 12px rgba(79, 84, 52, 0.14);
    }

    @media (prefers-reduced-motion: reduce) {
      .boton, .red { transition: none; }
    }
  </style>
</head>
