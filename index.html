<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Mymo Beauty</title>
  <meta name="description" content="Mymo Beauty · Clínica de estética avanzada, especialistas en tratamientos 100% personalizados.">
  <meta name="theme-color" content="#8A9468">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --beige: #E9DCC6;
      --crema: #F6F0E6;
      --oliva: #6E7B4C;
      --oliva-oscuro: #4C5634;
      --texto: #3B3F2E;
      --boton-bg: rgba(255, 252, 246, 0.82);
      --boton-borde: rgba(110, 123, 76, 0.25);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { min-height: 100%; }

    body {
      font-family: "Montserrat", system-ui, -apple-system, sans-serif;
      color: var(--texto);
      background-color: var(--beige);
      /* Degradado suave: crema → beige → verde oliva */
      background-image: linear-gradient(170deg, var(--crema) 0%, var(--beige) 45%, #B9B58E 75%, var(--oliva) 100%);
      background-attachment: fixed;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      justify-content: center;
      -webkit-font-smoothing: antialiased;
    }

    .contenedor {
      width: 100%;
      max-width: 460px;
      padding: calc(48px + env(safe-area-inset-top)) 20px calc(36px + env(safe-area-inset-bottom));
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    /* ---------- Cabecera ---------- */
    .foto {
      width: 112px;
      height: 112px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid rgba(255, 255, 255, 0.85);
      box-shadow: 0 8px 24px rgba(76, 86, 52, 0.18);
      background: var(--crema);
    }

    .monograma {
      width: 112px;
      height: 112px;
      border-radius: 50%;
      display: none;
      align-items: center;
      justify-content: center;
      background: var(--oliva);
      color: var(--crema);
      font-family: "Cormorant Garamond", serif;
      font-size: 52px;
      font-weight: 600;
      border: 3px solid rgba(255, 255, 255, 0.85);
      box-shadow: 0 8px 24px rgba(76, 86, 52, 0.18);
    }

    h1 {
      margin-top: 18px;
      font-family: "Cormorant Garamond", serif;
      font-weight: 600;
      font-size: 34px;
      letter-spacing: 0.04em;
      color: var(--oliva-oscuro);
    }

    .descripcion {
      margin-top: 8px;
      max-width: 320px;
      font-size: 14px;
      line-height: 1.55;
      color: var(--texto);
      opacity: 0.85;
    }

    /* ---------- Botones ---------- */
    .enlaces {
      width: 100%;
      margin-top: 32px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      list-style: none;
    }

    .boton {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      min-height: 58px;
      padding: 16px 20px;
      border-radius: 16px;
      background: var(--boton-bg);
      border: 1px solid var(--boton-borde);
      color: var(--oliva-oscuro);
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      text-decoration: none;
      box-shadow: 0 4px 14px rgba(76, 86, 52, 0.10);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
      -webkit-tap-highlight-color: transparent;
    }

    .boton svg { width: 20px; height: 20px; flex-shrink: 0; }

    .boton:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(76, 86, 52, 0.16);
      background: #FFFDF8;
    }

    .boton:active { transform: scale(0.98); }

    .boton.destacado {
      background: var(--oliva);
      border-color: var(--oliva);
      color: var(--crema);
    }
    .boton.destacado:hover { background: var(--oliva-oscuro); }

    .boton:focus-visible,
    .red:focus-visible {
      outline: 3px solid var(--oliva-oscuro);
      outline-offset: 3px;
    }

    /* ---------- Redes ---------- */
    .redes {
      margin-top: 40px;
      display: flex;
      gap: 18px;
      justify-content: center;
    }

    .red {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255, 252, 246, 0.85);
      color: var(--oliva-oscuro);
      box-shadow: 0 4px 12px rgba(76, 86, 52, 0.14);
      transition: transform 0.15s ease, background 0.15s ease, color 0.15s ease;
      -webkit-tap-highlight-color: transparent;
    }
    .red svg { width: 24px; height: 24px; }
    .red:hover { transform: translateY(-2px); background: var(--oliva-oscuro); color: var(--crema); }

    footer {
      margin-top: auto;
      padding-top: 36px;
      font-size: 11px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--crema);
      opacity: 0.9;
    }

    @media (prefers-reduced-motion: reduce) {
      .boton, .red { transition: none; }
    }
  </style>
</head>
